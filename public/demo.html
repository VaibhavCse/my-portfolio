<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/portfolio_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Vaibhav Chaudhary Portfolio" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Vaibhav Chaudhary</title>
    <style>
      .chatbot-icon {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background-color: white;
        color: white;
        border: none;
        border-radius: 50%;
        width: 60px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        z-index: 1000;
      }
      .chatbot-icon img {
        width: 40px;
        height: 40px;
      }
    </style>
  </head>
  <body>
    <noscript>welcome</noscript>
    <div id="root"></div>

    <!-- Chatbot Icon -->
    <button class="chatbot-icon" id="chatbotButton">
      <img src="chatbot_icon.jpg" alt="Chatbot Icon" />
    </button>

    <!-- Chatbot Script -->
    <script src="https://cdn.botpress.cloud/webchat/v2/inject.js"></script>
    <script>
      function initializeBotpressWebChat() {
        if (window.botpressWebChat) {
          window.botpressWebChat.init({
            botId: '10d8b291-a33c-4fbf-848a-2a736cacc36e',
            hostUrl: 'https://cdn.botpress.cloud',
            configUrl: 'https://files.bpcontent.cloud/2025/01/04/09/20250104093459-FJVHRJXT.json',
            closeButtonPosition: 'top-right',
            debugMode: true,
          });

          console.log("Botpress WebChat initialized:", window.botpressWebChat);

          const chatbotButton = document.getElementById('chatbotButton');
          if (chatbotButton) {
            chatbotButton.addEventListener('click', () => {
              console.log('Chatbot icon clicked!');
              setTimeout(() => {
                try {
                  window.botpressWebChat.sendEvent({ type: 'show' });
                } catch (error) {
                  console.error("Error opening chatbot:", error);
                }
              }, 1000);
            });
          } else {
            console.error('Chatbot button not found.');
          }
        } else {
          console.error('Botpress WebChat script not loaded correctly.');
        }
      }

      if (window.botpressWebChat) {
        initializeBotpressWebChat();
      } else {
        console.error('Botpress WebChat is not available.');

        // Retry after 3 seconds
        setTimeout(() => {
          if (!window.botpressWebChat) {
            console.log('Retrying Botpress WebChat initialization...');
            initializeBotpressWebChat();
          }
        }, 3000);
      }
    </script>
  </body>
</html>
